# ─────────────────────────────────────────────────────────────────
#  video2reels — Phase 1 Infrastructure
#  Services: postgres · redis · minio · api · worker-cpu ·
#            worker-gpu · flower · nginx
# ─────────────────────────────────────────────────────────────────

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: infra/Dockerfile.worker
  env_file: .env
  environment:
    PYTHONPATH: "/app"
    DATABASE_URL: "postgresql+asyncpg://video2reels:video2reels@postgres:5432/video2reels"
    REDIS_URL: "redis://redis:6379/0"
    MINIO_ENDPOINT: "minio:9000"
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    FFMPEG_PATH: "/usr/bin/ffmpeg"
  volumes:
    - ./api:/app/api
    - ./workers:/app/workers
    - ./prompts:/app/prompts
    - ./models:/app/models
    - video_work:/tmp/video_work
    - whisper_cache:/root/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: video2reels
      POSTGRES_PASSWORD: video2reels
      POSTGRES_DB: video2reels
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video2reels"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────────
  # pgsty/minio: community-maintained MinIO fork, public Docker Hub, no auth needed
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  # Buckets are created automatically by the api service on startup (see api/main.py lifespan)

  # ── FastAPI Application ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://video2reels:video2reels@postgres:5432/video2reels"
      REDIS_URL: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - ./api:/app/api
      - ./workers:/app/workers
      - ./infra:/app/infra
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Celery CPU Worker (also acts as fallback consumer for 'gpu' queue when worker-gpu is not running)
  worker-cpu:
    <<: *worker-base
    command: >
      celery -A workers.celery_app worker
        --queues gpu,cpu
        --concurrency 2
        --hostname cpu@%h
        --loglevel INFO
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Celery GPU Worker ─────────────────────────────────────────
  #   Requires NVIDIA GPU + nvidia-container-toolkit. Uncomment if available.
  # worker-gpu:
  #   <<: *worker-base
  #   command: >
  #     celery -A workers.celery_app worker
  #       --queues gpu
  #       --concurrency 1
  #       --hostname gpu@%h
  #       --loglevel INFO
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #       limits:
  #         memory: 8G

  # ── Flower (Celery monitoring UI) ────────────────────────────
  flower:
    image: mher/flower:latest
    command: >
      celery flower
        --broker=redis://redis:6379/0
        --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx reverse proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── Next.js Web UI ───────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  video_work:
  whisper_cache:
